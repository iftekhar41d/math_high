server {
    listen 80;
    server_name __DOMAIN__;

    root __APP_DIR__/web/dist;
    index index.html;

    # Proxy API calls to the FastAPI service (uvicorn bound to localhost only).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lecture media (images) written by the storage abstraction
    # (api/app/storage.py). Served straight off disk — never through the API.
    # `root` (not `alias`) so the `/media/` in the URL maps cleanly onto
    # __APP_DIR__/api/data/media/ and `try_files` resolves against it.
    location /media/ {
        root __APP_DIR__/api/data;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # SPA fallback so Vue Router-style deep links (if added later) work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
